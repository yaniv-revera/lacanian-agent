# fly.io deployment. Only needed when you leave your own machine.
app = "lacanian-agent"
primary_region = "cdg"

[build]

[env]
  PORT = "3000"
  DB_PATH = "/data/app.db"
  # Turns on the fail-closed startup checks (ALLOWED_EMAILS required,
  # MAILER=console refused) — without this they never engage, and this is
  # a closed pilot, not a public launch.
  NODE_ENV = "production"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
